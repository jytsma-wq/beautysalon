name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: mysql://build:build@localhost:3306/build
  DIRECT_DATABASE_URL: mysql://build:build@localhost:3306/build
  CONTACT_EMAIL: info@silkbeautysalon.online
  SMTP_HOST: smtp.hostinger.com
  SMTP_PORT: '465'
  SMTP_SECURE: 'true'
  SMTP_USER: info@silkbeautysalon.online
  SMTP_PASSWORD: ci-placeholder-password
  SMTP_FROM: Silk Beauty Salon <info@silkbeautysalon.online>
  NEXT_PUBLIC_SITE_URL: https://silkbeautysalon.online

jobs:
  verify:
    name: Validate, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate translations
        run: npm run validate:i18n

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v4
        with:
          name: silk-beauty-salon-standalone
          path: |
            .next/standalone
            .next/static
            public/apk/silk-beauty-salon.apk
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce dependency audit policy
        run: npm audit --audit-level=high

      - name: Check for verified secrets
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          version: 3.95.9
          extra_args: --debug --only-verified
